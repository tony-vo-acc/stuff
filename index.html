<script id="question-data" type="application/json">
[{"id": 1, "chapter": 5, "topic": "Political Parties", "question": "Who can participate in the precinct convention?", "options": ["a) Anyone who voted in that party's primary election", "b) Anyone who was invited to participate by the state party chair", "c) Anyone who voted in the previous gubernatorial election", "d) Any registered voter who lives in that precinct"], "correct_answer": "a) Anyone who voted in that party's primary election", "explanation": "Anyone who voted in that party's primary for that precinct is eligible to take part in the precinct convention, which is held after polls close on primary night to select delegates and resolutions to send to the county or senate district convention."}, {"id": 2, "chapter": 5, "topic": "Political Parties", "question": "The process by which someone learns about the world from others, and through which they come to understand and interpret political events and issues, is known as", "options": ["a) opinion polling.", "b) political socialization.", "c) political culture.", "d) acculturation."], "correct_answer": "b) political socialization.", "explanation": "Political socialization is the lifelong process of learning about politics from family, school, media, and peers, which shapes how a person interprets political events. It's different from political culture (shared values) or opinion polling (measuring views)."}, {"id": 3, "chapter": 5, "topic": "Political Parties", "question": "The Democratic Party has been the minority party in Texas since the mid-1990s.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Republicans have carried every statewide office in every election since 1998 and have controlled the legislature and all three branches of state government since 2002, making the Democratic Party the clear minority party since the mid-to-late 1990s."}, {"id": 4, "chapter": 5, "topic": "Political Parties", "question": "Which of the following third parties has been most successful in terms of winning elections in Texas?", "options": ["a) La Raza Unida", "b) the Dixiecrats", "c) the Working Families Party", "d) the Libertarian Party"], "correct_answer": "a) La Raza Unida", "explanation": "La Raza Unida, founded in 1970, recruited and trained candidates and won local offices in parts of Texas, giving it more direct electoral success than the Libertarian Party, which has shaped major-party positions but rarely won elections outright."}, {"id": 5, "chapter": 5, "topic": "Political Parties", "question": "What is one of the key functions of the county executive committee in Texas?", "options": ["a) registering new voters", "b) writing the party's platform", "c) selecting someone to serve as precinct chair", "d) running the county's primary elections"], "correct_answer": "d) running the county's primary elections", "explanation": "The county executive committee \u2014 made up of the county chair and precinct chairs \u2014 runs the county's primary elections, in addition to planning county conventions and handling party business between elections."}, {"id": 6, "chapter": 5, "topic": "Political Parties", "question": "During the late nineteenth and early twentieth centuries, Texas was a competitive, two-party state.", "options": ["True", "False"], "correct_answer": "False", "explanation": "During this period Texas was a one-party Democratic state; Republicans held almost no offices statewide until the party's growth accelerated in the late 20th century, so there was no real two-party competition yet."}, {"id": 7, "chapter": 5, "topic": "Political Parties", "question": "A political party outlines its fundamental principles and positions in which of the following?", "options": ["a) a party platform", "b) a party primary", "c) a party manifesto", "d) a party guidebook"], "correct_answer": "a) a party platform", "explanation": "A party platform is the formal statement of a party's principles and policy positions that it commits to pursue if its candidates are elected, giving voters a way to compare the parties' priorities."}, {"id": 8, "chapter": 5, "topic": "Political Parties", "question": "Local issues are always ideological in nature.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Local issues (potholes, zoning, school bonds) are usually practical rather than ideological, though partisan polarization has increasingly nationalized even some local races and elections."}, {"id": 9, "chapter": 5, "topic": "Political Parties", "question": "Which of the following governing bodies is responsible for directing state party operations between conventions?", "options": ["a) the state executive committee", "b) the state advisory committee", "c) the state policy planning committee", "d) the state steering committee"], "correct_answer": "a) the state executive committee", "explanation": "The state executive committee \u2014 made up of committeemen and committeewomen chosen by convention delegates \u2014 governs the party's activities statewide between conventions, while the state chair and vice chair run day-to-day business."}, {"id": 10, "chapter": 5, "topic": "Political Parties", "question": "In Texas, the most local level of a party organization is the county.", "options": ["True", "False"], "correct_answer": "False", "explanation": "The precinct, not the county, is the most basic level of party organization; precinct chairs are elected locally and collectively make up the county executive committee."}, {"id": 11, "chapter": 5, "topic": "Political Parties", "question": "No Democratic candidate for President has won a majority of Texas' votes since", "options": ["a) Barack Obama", "b) Bill Clinton", "c) George W. Bush", "d) Jimmy Carter"], "correct_answer": "d) Jimmy Carter", "explanation": "Jimmy Carter, in 1976, was the last Democratic presidential candidate to win a majority of Texas's vote; every Democratic nominee since has lost the state."}, {"id": 12, "chapter": 5, "topic": "Political Parties", "question": "Texas uses single-member districts with winner-take-all elections to fill the state House of Representatives. The table below displays the results from the general election for a district in central Texas [Alligator Party: 37%, Bear Party: 13%, Chipmunk Party: 43%, Deer Party: 7%]. Given these hypothetical results, which event will take place?", "options": ["a) There would need to be a runoff election between the candidates from the Alligator and Chipmunk Parties.", "b) The candidates from the Alligator and Chipmunk Parties would form a coalition to share power.", "c) The candidate from the Chipmunk Party would become that district's representative.", "d) Since no one received a plurality of votes, the governor could appoint one of these candidates to serve as the interim representative until the next general election."], "correct_answer": "c) The candidate from the Chipmunk Party would become that district's representative.", "explanation": "Texas's single-member districts use a first-past-the-post, plurality-wins system: whichever candidate gets the most votes wins outright, even without a majority. With 43%, the Chipmunk Party candidate has a plurality and takes the seat \u2014 no runoff or coalition is required in a legislative general election like this."}, {"id": 13, "chapter": 5, "topic": "Political Parties", "question": "Today, most Texans who identify as Democrats consider themselves conservative or \"Blue Dog\" Democrats.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Today's Texas Democratic base is largely progressive/liberal, concentrated among African Americans, Latinos, women, and White liberals in urban areas \u2014 a shift away from the conservative 'Blue Dog' Democrats who once dominated the party."}, {"id": 14, "chapter": 5, "topic": "Political Parties", "question": "Which of these organizations is tasked with maintaining a political party's presence in the state of Texas, raising campaign donations, selecting quality candidates, and coordinating the party's activities throughout the state?", "options": ["a) the plural executive", "b) voters in primary elections", "c) the electoral college", "d) the permanent party structure"], "correct_answer": "d) the permanent party structure", "explanation": "The permanent party organization \u2014 the network of precinct chairs, county chairs/committees, and the state chair/executive committee \u2014 handles the ongoing business of running a party: fundraising, candidate recruitment, and coordinating activity statewide."}, {"id": 15, "chapter": 5, "topic": "Political Parties", "question": "Which of the following statements about Black people winning elected office in Texas is accurate?", "options": ["a) Black people have served in more than half of elected positions within the state government.", "b) Black people have been elected mayors of the three largest cities in Texas.", "c) There has only been one Black senator from Texas.", "d) Black people have been elected to every position in the plural executive."], "correct_answer": "b) Black people have been elected mayors of the three largest cities in Texas.", "explanation": "Black officeholders have been elected mayor in Houston, Dallas, and San Antonio (the state's three largest cities), even though Black representation across all of Texas's elected offices remains far short of proportional."}, {"id": 16, "chapter": 5, "topic": "Political Parties", "question": "When former speaker of the House of Representatives Tip O'Neill said, \"all politics is local,\" he was talking about how", "options": ["a) local issues are not generally ideological.", "b) powerful local interests are in state politics.", "c) the federal government only has powers granted to it by state governments.", "d) all meaningful decisions are made by state and local governments."], "correct_answer": "a) local issues are not generally ideological.", "explanation": "O'Neill's point was that local elections and issues (like a pothole or a school bond) usually aren't shaped by liberal-versus-conservative ideology the way national politics is \u2014 though this has become less true as polarization nationalizes even local races."}, {"id": 17, "chapter": 5, "topic": "Political Parties", "question": "Which of the following is often seen as marking the start of a major shift in party dominance in Texas?", "options": ["a) Ronald Reagan (R) winning a majority of votes in Texas for his 1980 presidential campaign", "b) George W. Bush (R) winning Texas in the 2000 general election", "c) Beto O'Rourke losing his bid to unseat Senator Ted Cruz in 2018", "d) Michael Dukakis (D) losing his 1988 bid for the presidency"], "correct_answer": "a) Ronald Reagan (R) winning a majority of votes in Texas for his 1980 presidential campaign", "explanation": "Ronald Reagan winning Texas in 1980 \u2014 fueled by his calls for smaller government and a wave of 'Reagan Democrats' switching allegiance \u2014 is generally seen as the moment that began the long-term shift from Democratic to Republican dominance in the state."}, {"id": 18, "chapter": 5, "topic": "Political Parties", "question": "Relative to traditional media, political parties find that social media is a more cost-effective way to connect with potential voters, raise funds, and drive voter turnout.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Parties increasingly rely on platforms like YouTube, Facebook, and X because they let candidates reach, mobilize, and fundraise from voters directly and cheaply, without paying for costly print or broadcast advertising."}, {"id": 19, "chapter": 5, "topic": "Political Parties", "question": "The Libertarian Party is both socially and economically liberal.", "options": ["True", "False"], "correct_answer": "False", "explanation": "The Libertarian Party pairs social liberalism (personal freedom on issues like drug policy or marriage) with economic conservatism (limited government, low taxes, minimal regulation) \u2014 not economic liberalism, which would call for more government intervention."}, {"id": 20, "chapter": 5, "topic": "Political Parties", "question": "Although the Democratic Party dominated Texas politics for much of the twentieth century, by the 1950s it faced internal divisions between ________ and ________ Democrats.", "options": ["a) moderate; liberal", "b) Blue Dog Democrats; Yellow Dog", "c) liberal; conservative", "d) conservative; moderate"], "correct_answer": "c) liberal; conservative", "explanation": "By the 1950s, the 'umbrella' Texas Democratic Party was splitting between conservative Democrats (who broke with national party positions on the New Deal and civil rights) and liberal Democrats, a division that eventually helped drive conservatives toward the Republican Party."}, {"id": 21, "chapter": 6, "topic": "Campaigns and Elections", "question": "In which scenario would a runoff primary be most likely to occur?", "options": ["a) Six candidates are all running for the Democratic nomination for U.S. Senate.", "b) Two candidates running for the Republican nomination for governor have similar-sounding names that confused voters.", "c) One candidate participating in the primary process is accused of violating campaign finance rules, requiring that the primary elections be \"rerun\" through a runoff election.", "d) There was a delay in processing voter registrations, and more than one-third of the eligible voters were unable to participate in the primary election."], "correct_answer": "a) Six candidates are all running for the Democratic nomination for U.S. Senate.", "explanation": "With six candidates splitting the vote in one primary, it's very unlikely any single candidate crosses 50%, triggering a runoff between the top two finishers \u2014 runoffs happen specifically when no candidate wins an outright majority."}, {"id": 22, "chapter": 6, "topic": "Campaigns and Elections", "question": "In 2022, over 75 percent of voting-age Texans were registered to vote.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Texas voter registration has climbed in recent years due to expanded registration efforts, and by 2022 it exceeded 75% of the voting-age population \u2014 even though actual turnout still lags many other states."}, {"id": 23, "chapter": 6, "topic": "Campaigns and Elections", "question": "Which of these begins with primary elections to determine each party's candidates and concludes with general elections that decide who wins office?", "options": ["a) electoral district", "b) electoral system", "c) electoral cycle", "d) electoral structure"], "correct_answer": "c) electoral cycle", "explanation": "The electoral cycle describes the full process candidates go through: starting with party primaries (and possible runoffs) in the spring and ending with the general election, typically in November."}, {"id": 24, "chapter": 6, "topic": "Campaigns and Elections", "question": "Why did the U.S. Department of Justice (DOJ) sue the State of Texas under Section 2 of the Voting Rights Act in 2021?", "options": ["a) The DOJ claimed that the new districts created by the state as part of the redistricting process discriminated against Latino and African American voters.", "b) The DOJ claimed that the strict voter ID requirement violated the provision that all citizens must be able to cast a vote."], "correct_answer": "a) The DOJ claimed that the new districts created by the state as part of the redistricting process discriminated against Latino and African American voters.", "explanation": "The DOJ's 2021 lawsuit argued that Texas's newly drawn congressional and legislative maps diluted the voting power of Latino and Black voters by packing or splitting them across districts, violating Section 2 of the Voting Rights Act, which bars racially discriminatory district lines regardless of intent."}, {"id": 25, "chapter": 6, "topic": "Campaigns and Elections", "question": "Although some state and local issues are still important to voters, recent elections have seen both of Texas's major political parties shift their focus toward national issues.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Even though state and local issues still matter, both parties have increasingly framed Texas campaigns around national figures and controversies (like the president or national culture-war debates), reflecting the broader nationalization of state politics."}, {"id": 26, "chapter": 6, "topic": "Campaigns and Elections", "question": "Initially signed into law in 1965, the Voting Rights Act has since been renewed and expanded several times. Which of the following accurately describes one of the new provisions of the law?", "options": ["a) potential voters to verbally swear or affirm that they are legal citizens and otherwise eligible to vote in the election", "b) election officials to make bilingual ballots available in areas where more than 5 percent of the voters speak a language other than English", "c) funds raised from the various poll taxes to be used to help defray the costs associated with elections and election integrity", "d) voters to present a current, valid form of photo identification prior to voting in all primary and general elections"], "correct_answer": "b) election officials to make bilingual ballots available in areas where more than 5 percent of the voters speak a language other than English", "explanation": "One of the VRA's protections requires election officials in areas with significant non-English-speaking populations (more than 5%) to provide bilingual ballots and materials, ensuring language isn't a barrier to voting."}, {"id": 27, "chapter": 6, "topic": "Campaigns and Elections", "question": "What is the most basic and fundamental duty citizens have in a democracy?", "options": ["a) voting", "b) attending a rally", "c) signing a petition", "d) financial contributions"], "correct_answer": "a) voting", "explanation": "Voting is considered the most basic form of democratic participation \u2014 the minimum way citizens hold elected officials accountable \u2014 even though other forms like petitions, rallies, or donations also matter."}, {"id": 28, "chapter": 6, "topic": "Campaigns and Elections", "question": "Public opinion polling can play an important role in creating targeted messages during campaigns.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Campaigns use polling to find out which issues matter most to which voters, then craft and target messaging accordingly, making polling a key strategic tool rather than just a horse-race snapshot."}, {"id": 29, "chapter": 6, "topic": "Campaigns and Elections", "question": "In the context of voting, to what does the term suffrage refer?", "options": ["a) It is an allusion to the struggles faced by minorities in their fight for civil rights.", "b) It is a measure of how difficult it is for voters to cast their ballots in an election.", "c) It is simply one's right to vote.", "d) It is a description of how widespread political discontent is across an area."], "correct_answer": "c) It is simply one's right to vote.", "explanation": "Suffrage (the franchise) simply means the legal right to vote \u2014 a right that in Texas expanded over time as restrictions like the poll tax, white primary, and property/residency requirements were struck down."}, {"id": 30, "chapter": 6, "topic": "Campaigns and Elections", "question": "Primary elections in Texas are generally held in March.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Texas holds its party primaries in March, well ahead of the November general election, giving time for any runoff before the general election cycle begins."}, {"id": 31, "chapter": 6, "topic": "Campaigns and Elections", "question": "Newspaper endorsements tend be more influential in which types of races?", "options": ["a) down-ballot races, such as for school board or city council, where there is not as much coverage or attention paid to the race", "b) general election races, in which voters think their vote \"matters more\"", "c) when there is no incumbent running; therefore, there is no \"name recognition\" in the race", "d) in highly contested races"], "correct_answer": "a) down-ballot races, such as for school board or city council, where there is not as much coverage or attention paid to the race", "explanation": "In races like school board or city council, voters typically know little about the candidates and there's little media coverage, so a newspaper's endorsement can carry outsized influence compared to high-profile statewide or national races."}, {"id": 32, "chapter": 6, "topic": "Campaigns and Elections", "question": "Texans tend to vote at higher rates than the national average.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Texas has historically ranked among the lowest states in voter turnout, due to factors like a younger population, a large share of Latino residents (who vote at lower rates), a one-party dominant political landscape, and an overwhelming number of elections and offices on the ballot."}, {"id": 33, "chapter": 6, "topic": "Campaigns and Elections", "question": "When people vote in a primary election, they are", "options": ["a) selecting a party's delegates for the precinct convention.", "b) selecting a party's delegates for the state convention.", "c) selecting precinct chairs throughout the state.", "d) selecting a party's candidate for the general election."], "correct_answer": "d) selecting a party's candidate for the general election.", "explanation": "A primary election is how a party's own voters choose which candidate will represent that party on the general election ballot \u2014 it doesn't select convention delegates or precinct chairs directly."}, {"id": 34, "chapter": 6, "topic": "Campaigns and Elections", "question": "In Texas, who is primarily responsible for redistricting?", "options": ["a) the governor", "b) the legislature", "c) the lieutenant governor", "d) the judiciary"], "correct_answer": "b) the legislature", "explanation": "The Texas Legislature draws new congressional and state legislative district lines, typically every 10 years after the census \u2014 a process that has become a major partisan battleground, with the Republican majority frequently accused of gerrymandering to protect its power."}, {"id": 35, "chapter": 6, "topic": "Campaigns and Elections", "question": "Until 1971, Texas used a system of early registration that required which of the following?", "options": ["a) Voters had to live in a county for at least two years before they could register to vote in that county and were required to register to vote every single year.", "b) Voters had to register to vote more than nine months before the general election and were required to register to vote every year.", "c) Voters had to live in Texas for at least six months before they could register to vote and were required to register to vote every three years.", "d) Voters had to indicate their race or ethnicity on their voter registration forms and were required to register to vote every year."], "correct_answer": "b) Voters had to register to vote more than nine months before the general election and were required to register to vote every year.", "explanation": "Until courts struck it down in the 1970s, Texas required voters to register more than nine months before the general election and to re-register every single year, a system that especially disenfranchised migrant workers and others who moved often."}, {"id": 36, "chapter": 6, "topic": "Campaigns and Elections", "question": "The U.S. Supreme Court's decision in which case ended the Texas Democratic Party's use of the \"White primary\"?", "options": ["a) Smith v. Allwright (1944)", "b) Newberry v. United States (1921)", "c) Nixon v. Condon (1932)", "d) Grovey v. Townsend (1935)"], "correct_answer": "a) Smith v. Allwright (1944)", "explanation": "Smith v. Allwright (1944) was the U.S. Supreme Court decision that finally struck down the white primary, ruling that because primaries were an integral part of the state's election machinery, excluding Black voters from them was unconstitutional state action."}, {"id": 37, "chapter": 6, "topic": "Campaigns and Elections", "question": "Why is it so difficult to get on the ballot as an independent in Texas?", "options": ["a) The state legislature barred independent or third-party candidates in 1996; since then it is a formal requirement to be a member of the Democratic or Republican party in order to run for office.", "b) The parties that control government, and therefore control ballot access, want to maintain their power and make it harder for other parties to compete for votes during elections.", "c) There are conflicting elements of state law that end up making it practically impossible for independent candidates to get on the ballot.", "d) State law requires that you must run for office as a member of a party, and that the parties must run candidates in all counties. Since there are so many counties, it is often too difficult for small parties to find candidates to run in all counties."], "correct_answer": "b) The parties that control government, and therefore control ballot access, want to maintain their power and make it harder for other parties to compete for votes during elections.", "explanation": "Independent and third-party ballot access is deliberately difficult because the two major parties, who control the laws governing elections, have an incentive to limit competition and protect their own dominance \u2014 through high signature thresholds and other formal requirements."}, {"id": 38, "chapter": 6, "topic": "Campaigns and Elections", "question": "Reapportionment involves the determination of how district lines will be drawn in each state for the state legislature and the U.S. House of Representatives.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Reapportionment is the census-driven process of adjusting how many representatives each area of the state (and each state in Congress) gets based on population change, which in turn requires redrawing district boundaries for the state legislature and U.S. House \u2014 closely linking it to redistricting."}, {"id": 39, "chapter": 6, "topic": "Campaigns and Elections", "question": "Most statewide elections over the past two decades have been won by members of the Republican Party. What effect have these results had on elections in Texas?", "options": ["a) The cost of running a campaign has steadily increased.", "b) \"Get out the vote\" efforts are seen as a less useful tool for campaigns and parties.", "c) To boost their support, candidates are increasingly appealing to moderate voters.", "d) The Republican primary election is often more competitive than the general election."], "correct_answer": "d) The Republican primary election is often more competitive than the general election.", "explanation": "Because Republicans have won nearly every statewide race for two decades, the real contest for many offices happens in the Republican primary, not the general election, since winning that primary is often tantamount to winning the seat."}, {"id": 40, "chapter": 6, "topic": "Campaigns and Elections", "question": "In 1923, the Texas legislature established _____________________ to prohibit African Americans from voting in the Democratic primary.", "options": ["a) the literacy test", "b) the poll tax", "c) the White primary", "d) early registration"], "correct_answer": "c) the White primary", "explanation": "In 1923, the Texas Legislature passed a law explicitly barring Black voters from participating in the Democratic primary \u2014 the formal start of the 'white primary' system that was later challenged in a series of Supreme Court cases before finally being struck down in Smith v. Allwright (1944)."}, {"id": 41, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "In order to gain access to politicians, interest groups in Texas will often", "options": ["a) spend money on entertaining politicians.", "b) spend money to reward people for voting.", "c) provide the infrastructure, such as campaign signs and office staff, needed for the politician to get reelected.", "d) threaten elected officials."], "correct_answer": "a) spend money on entertaining politicians.", "explanation": "Interest groups frequently gain access to policymakers through entertainment \u2014 expensive dinners, sports outings, and similar hospitality \u2014 which also helps offset Texas legislators' notably low salaries."}, {"id": 42, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Because it is typically not as well funded as other types of interest groups, which of the following more often relies on grassroots efforts by its members to contact elected officials and promote the interest group's agenda?", "options": ["a) industry-specific interest group", "b) civil rights interest group", "c) public interest group", "d) peak association interest group"], "correct_answer": "c) public interest group", "explanation": "Public interest groups, which advocate for broad causes rather than a narrow industry, typically have less money than business or professional groups and so lean more heavily on grassroots mobilization \u2014 getting members to directly contact their elected officials."}, {"id": 43, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "By law, lobbyists can only work for one organization at a time in order to prevent any conflicts of interest by the lobbyist.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Texas law does not restrict lobbyists to a single client; in fact, many lobbyists represent multiple organizations simultaneously, which is itself part of why conflict-of-interest and disclosure rules matter."}, {"id": 44, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Of the various tools interest groups have to use, which of these is the most powerful and effective means of supporting politicians who are friendly to their goals?", "options": ["a) writing letters", "b) staying neutral", "c) contributing to their campaigns", "d) hiring staff personnel"], "correct_answer": "c) contributing to their campaigns", "explanation": "Campaign contributions are considered the most direct and effective way interest groups support friendly politicians, since money helps candidates fund the ads and outreach needed to win \u2014 and build goodwill for future access."}, {"id": 45, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "One of the ways that Texas's Constitution limits the power of the state government is by holding regular legislative sessions every two years and capping the number of staff that legislators can hire to help them through these sessions. How does this limitation impact the relationship between legislators and lobbyists?", "options": ["a) Given the prolonged nature of the law-making process, lobbyists often have little insight as to how legislation is advancing.", "b) Lobbyists can act as temporary legislators while the legislator is not in session, including doing casework for constituents.", "c) Legislators may use campaign donations from interest groups and lobbyists to cover the cost of hiring additional staff.", "d) Because legislators have limited time and resources, lobbyists are in a better position to offer detailed insight and assistance to legislators."], "correct_answer": "d) Because legislators have limited time and resources, lobbyists are in a better position to offer detailed insight and assistance to legislators.", "explanation": "Because the Texas Legislature meets only every two years in relatively short sessions and lawmakers have limited staff, legislators often depend on lobbyists to provide the detailed research, drafting help, and expertise their own offices don't have time or capacity to produce."}, {"id": 46, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "In terms of membership and their ability to get issues turned into laws, interest groups representing private labor organizations and unions are often seen as the most influential type of interest groups in Texas politics.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Despite representing many workers, labor and union interest groups carry less influence in Texas than business, oil and gas, and high-tech interests, which dominate policymaking due to their money, organization, and access."}, {"id": 47, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "One of the largest groups in Texas is consumers. Why is it the case that this group of voters is typically unable to have a sizable impact on Texas legislators through the lobbying process?", "options": ["a) Consumer groups are more interested in influencing federal lawmakers than state lawmakers.", "b) Given how diverse and disconnected this group is, there are few interest groups that focus specifically on consumers.", "c) Although this group is large, Texas consumers are often split over issues such as brand preference, cost, and preferred methods of shopping.", "d) It is difficult to train members of such a large group to become effective lobbyists."], "correct_answer": "b) Given how diverse and disconnected this group is, there are few interest groups that focus specifically on consumers.", "explanation": "Consumers are a huge but extremely diverse population who disagree on brand loyalty, cost priorities, and shopping habits, and there are correspondingly few interest groups organized specifically around 'consumer' interests \u2014 unlike more unified industry or professional groups."}, {"id": 48, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Interest groups often offer incentives to join, such as selective benefits, to overcome the free rider problem.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Selective benefits \u2014 material perks, useful information, or a sense of purpose available only to members \u2014 give people a personal incentive to join and pay dues, helping groups overcome the temptation to free-ride off others' efforts."}, {"id": 49, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Political scientists often describe Texas as a \"pluralist society.\" Which of these statements best explains why?", "options": ["a) In addition to the two major parties, there are other parties who frequently run candidates in Texas's state and local elections.", "b) The right to associate with others is legally protected in Texas, and citizens have many options to interact with a large variety of groups.", "c) Texas has many laws that impose regulations on individuals and businesses.", "d) Texans are allowed to express their opinions through voting, protests, political donations, and party membership."], "correct_answer": "b) The right to associate with others is legally protected in Texas, and citizens have many options to interact with a large variety of groups.", "explanation": "Texas (like the U.S. generally) is called a pluralist society because the right to freely associate and petition government is constitutionally protected, giving individuals real freedom to organize into and choose among many competing groups."}, {"id": 50, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "If an interest group \"gets on the late train,\" it means that", "options": ["a) a political action committee donates money for a candidate in the general election but not in the primaries.", "b) an interest group picks up on an issue only after public-opinion polling shows a great deal of support.", "c) an interest group decides to lobby for a piece of legislation late in the legislative session.", "d) an interest group gives campaign contributions to a candidate who has already won the election in order to build a relationship with them."], "correct_answer": "d) an interest group gives campaign contributions to a candidate who has already won the election in order to build a relationship with them.", "explanation": "'Getting on the late train' means an interest group that opposed a candidate donates to them only after they've already won, as a way to smooth over the relationship and maintain future access \u2014 not a principled show of early support."}, {"id": 51, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "In which of the following hypothetical scenarios would an interest group be engaged in \"bundling\"?", "options": ["a) The Texas Association of Business identifies incumbents who want to boost Texas's economy and invites them to attend a conference hosted at a resort in Austin.", "b) The Texas Farm Bureau directs its members to call their representatives on a particular day and provides members with talking points for these conversations.", "c) The Texas Medical Association collects donations from its members over time and then makes a large, single donation to a candidate who supports the group's goals.", "d) The Texas State Teachers Association holds an annual meeting where it drafts and presents several pieces of related legislation to members of the state legislature."], "correct_answer": "c) The Texas Medical Association collects donations from its members over time and then makes a large, single donation to a candidate who supports the group's goals.", "explanation": "Bundling is when a group gathers many smaller individual contributions and delivers them together as one large donation, amplifying its influence with the candidate \u2014 exactly what the Texas Medical Association does by pooling member donations into a single sizable gift."}, {"id": 52, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "EMILY's List is a national PAC founded by women and focuses on raising money for women candidates at which part of the campaign cycle?", "options": ["a) during runoff elections only", "b) after the candidate has been elected", "c) late in the general election", "d) early in the campaign cycle / during the primary process"], "correct_answer": "d) early in the campaign cycle / during the primary process", "explanation": "EMILY's List (the acronym stands for 'Early Money Is Like Yeast' \u2014 it helps the dough rise) is built around funding women candidates early, particularly during the primary process, when early cash can be decisive in building a viable campaign."}, {"id": 53, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Which of these terms best describes an interest group that serves as an umbrella organization\u2014that is, a group that operates at a higher level to coordinate the activities of member groups in specific, targeted areas?", "options": ["a) peak association", "b) coordination association", "c) facilitation cooperation", "d) interest group coalition"], "correct_answer": "a) peak association", "explanation": "A peak association is an umbrella organization that coordinates the efforts of many member groups within a broader industry or interest area (like a statewide business federation coordinating local chambers of commerce)."}, {"id": 54, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "During the 2017 legislative session, lobbyists representing ______________ were influential in shaping legislation that repealed local ordinances.", "options": ["a) public school districts", "b) environmental groups", "c) county governments", "d) Uber and Lyft"], "correct_answer": "d) Uber and Lyft", "explanation": "In the 2017 session, lobbyists for Uber and Lyft successfully pushed a state law that preempted and repealed local ordinances regulating ride-hailing companies, replacing a patchwork of city rules with a single statewide framework the companies preferred."}, {"id": 55, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "In Federalist 10, what was James Madison's primary argument in support of what we could call interest groups today?", "options": ["a) Interest groups would work within the government to implement policies in the most efficient manner possible.", "b) Interest groups would be able to organize and run elections, eliminating this expensive task from the list of government responsibilities.", "c) Interest groups would nominate the most viable candidates to run for office.", "d) Interest groups would compete against one another, thereby protecting individuals from any one interest becoming too powerful and abusing its power."], "correct_answer": "d) Interest groups would compete against one another, thereby protecting individuals from any one interest becoming too powerful and abusing its power.", "explanation": "In Federalist No. 10, Madison argued that factions (what we'd call interest groups) can't be eliminated without destroying liberty, so the solution is to let many competing factions check one another in a large republic, preventing any single one from dominating and abusing power."}, {"id": 56, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Issue advocacy is coordinated spending between an interest group and a candidate for elected office.", "options": ["True", "False"], "correct_answer": "False", "explanation": "Issue advocacy is independent spending on a policy issue that is not coordinated with any specific candidate's campaign \u2014 coordinated spending directly with a candidate would raise it to the level of a campaign contribution, subject to different rules."}, {"id": 57, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Interest groups typically have more time, money, and expertise to offer politicians than do average citizens.", "options": ["True", "False"], "correct_answer": "True", "explanation": "Compared to individual citizens, interest groups can pool resources to offer far more time, money, and specialized expertise to lawmakers, which is part of why they can wield outsized influence in the policy process."}, {"id": 58, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Who were the \"steak men\" identified by Speaker Sam Rayburn at the beginning of the twentieth century?", "options": ["a) They were legislators who would attempt to cut all the meat out of the budgets.", "b) They were lobbyists who Rayburn said were full of \"bull.\"", "c) They were legislators who would \"sell\" their votes on a bill for free steak dinners.", "d) They were politicians who were in the pocket of the cattle industry."], "correct_answer": "c) They were legislators who would \"sell\" their votes on a bill for free steak dinners.", "explanation": "Speaker Sam Rayburn's 'steak men' referred to legislators seen as willing to trade their votes for free steak dinners and other entertainment from lobbyists \u2014 an early example of concerns over lobbyists buying access and influence through hospitality."}, {"id": 59, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "The practice of combining several individual campaign contributions into one larger contribution from a group in order to increase the group's impact is known as", "options": ["a) bundling.", "b) soft money.", "c) bribery.", "d) PAC-ing."], "correct_answer": "a) bundling.", "explanation": "Bundling is the practice of collecting many individual campaign contributions and combining them into a single larger donation from the group, which increases the group's visibility and influence with the candidate compared to scattered small donations."}, {"id": 60, "chapter": 7, "topic": "Interest Groups and Lobbying", "question": "Which of the following is an example of interest-group capture?", "options": ["a) When an interest group succeeds in getting its preferred candidates elected to positions within the plural executive, such as governor or attorney general.", "b) When a lobbyist is hired directly by a state agency to draft legislative reports.", "c) When candidates for seats on the Texas Railroad Commission receive a majority of their campaign donations from industries the Railroad Commission regulates, such as the oil and natural gas industry.", "d) When interest groups purchase advertising space to alter public opinion on pending legislation."], "correct_answer": "c) When candidates for seats on the Texas Railroad Commission receive a majority of their campaign donations from industries the Railroad Commission regulates, such as the oil and natural gas industry.", "explanation": "Interest-group capture occurs when a regulatory agency ends up serving the interests of the industry it's supposed to police \u2014 as critics allege happens with the Texas Railroad Commission, whose commissioners rely heavily on campaign donations from the oil and gas industry they regulate."}, {"id": 61, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "If a person cannot provide bail on his or her own or cannot pay a bondsman, then the accused can, in some circumstances, be released", "options": ["a) on collateral.", "b) by a cosigner.", "c) on 25 percent of bail amount.", "d) on personal recognizance."], "correct_answer": "d) on personal recognizance.", "explanation": "A defendant who can't afford bail or a bondsman's fee may sometimes be released on personal recognizance \u2014 a promise to appear in court, without paying money up front \u2014 typically for lower-risk defendants and less serious charges."}, {"id": 62, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "According to the Texas Forensic Science Commission, which of the following is junk science and should not be used as evidence in a criminal trial?", "options": ["a) testimony that connects a bite mark to a specific defendant's teeth", "b) testimony that matches a DNA profile from a properly collected sample", "c) testimony that connects an IP address to a specific defendant's physical address", "d) testimony that connects a partial fingerprint to a specific defendant"], "correct_answer": "a) testimony that connects a bite mark to a specific defendant's teeth", "explanation": "The Texas Forensic Science Commission has flagged bite-mark comparison testimony, along with practices like hair matching and some bullet-tracing techniques, as forensic methods that haven't held up to modern scientific scrutiny and shouldn't be relied on as courtroom evidence."}, {"id": 63, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "Suppose you are a prosecutor eager to prove to voters you can maintain high conviction rates. Which of the following would give you the surest odds that you would convict those you accuse of crimes?", "options": ["a) a bench trial", "b) a plea bargain between the defendant and the state", "c) a jury trial", "d) a no bill verdict from a grand jury"], "correct_answer": "b) a plea bargain between the defendant and the state", "explanation": "A plea bargain gives prosecutors close to a guaranteed conviction, since the defendant agrees to plead guilty (often to a lesser charge) in exchange for a reduced sentence \u2014 which is exactly why plea deals are so common and help prosecutors maintain high conviction rates."}, {"id": 64, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "What is qualified immunity?", "options": ["a) A legal doctrine that shields police from liability in all but the most extreme or egregious cases", "b) An element of the judicial processes and procedures that prevents judges and attorneys from serving as members of a jury"], "correct_answer": "a) A legal doctrine that shields police from liability in all but the most extreme or egregious cases", "explanation": "Qualified immunity is a legal doctrine that protects government officials, including police officers, from personal liability in civil suits unless they violated a 'clearly established' constitutional right \u2014 making it very hard to hold officers accountable except in the most egregious cases."}, {"id": 65, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "Suppose you are arrested and taken to jail. You must appear before a judge and be told what charges you are being accused of and reminded of your right to an attorney and right to remain silent. What is this process called?", "options": ["a) plea bargain", "b) pre-trial hearing", "c) arraignment", "d) grand jury indictment"], "correct_answer": "c) arraignment", "explanation": "This initial court appearance \u2014 where the accused hears the formal charges and is reminded of the right to counsel and to remain silent \u2014 is called an arraignment; it comes before any plea bargaining, pretrial hearings, or grand jury proceedings."}, {"id": 66, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "What does the \"three strikes\" provision of Texas criminal law require?", "options": ["a) Police officers must knock three times before entering a home under warrant.", "b) A person convicted of three felonies (or in some cases two felonies) is sentenced to life imprisonment.", "c) Any police officer with three instances of documented misconduct is placed on a suspension.", "d) A person on parole who commits three separate parole violations must serve the remainder of their sentence in prison."], "correct_answer": "b) A person convicted of three felonies (or in some cases two felonies) is sentenced to life imprisonment.", "explanation": "Texas's 'three-strikes' provision allows (and in some cases requires) a life sentence for someone convicted of a third felony \u2014 or in certain circumstances, a second one \u2014 reflecting a sentencing-enhancement approach aimed at repeat offenders."}, {"id": 67, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "The Texas prison population peaked in which year?", "options": ["a) 2000", "b) 2022", "c) 1994", "d) 1973"], "correct_answer": "a) 2000", "explanation": "Texas built out its prison system dramatically in the 1990s, and the incarcerated population peaked around 2000 before leveling off and gradually declining as the state expanded probation, parole, and diversion programs as alternatives to incarceration."}, {"id": 68, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "In Texas, the legal standard of proof \"beyond a reasonable doubt\" is used in which type(s) of cases?", "options": ["a) misdemeanor", "b) felony", "c) civil", "d) both felony and misdemeanor cases"], "correct_answer": "d) both felony and misdemeanor cases", "explanation": "'Beyond a reasonable doubt' is the standard of proof required for a criminal conviction in Texas, and it applies to both felony and misdemeanor prosecutions \u2014 it's a criminal-law standard, distinct from the lower 'preponderance of the evidence' standard used in civil cases."}, {"id": 69, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "The most controversial issue facing police in Texas and across the United States, and the subject of many protests throughout 2020, involves", "options": ["a) entrapment.", "b) the use of plea bargains.", "c) the use of force.", "d) unlawful searches and seizures."], "correct_answer": "c) the use of force.", "explanation": "Police use of force \u2014 and especially the use of deadly force \u2014 became the central flashpoint of protest and policy debate nationwide (and in Texas) after the killing of George Floyd in 2020, prompting new body-camera laws and reporting requirements."}, {"id": 70, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "In Texas, felony juries are composed of ________ people and misdemeanor juries are composed of ________ people.", "options": ["a) 12; 6", "b) 12; 5", "c) 9; 6", "d) 6; 3"], "correct_answer": "a) 12; 6", "explanation": "Texas felony juries have 12 members, while misdemeanor juries have 6 \u2014 a distinction tied to the greater seriousness and potential punishment involved in felony cases."}, {"id": 71, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "Suppose you are a juror on a felony case. How many members of the jury would need to vote the same way to render a decision?", "options": ["a) Any decision needs to be unanimous.", "b) A majority; for a felony case, that is 7 jurors.", "c) A majority; for a felony case, that is 4 jurors.", "d) It would take 8 votes to acquit but 11 votes to convict."], "correct_answer": "a) Any decision needs to be unanimous.", "explanation": "Texas jury verdicts, in both felony and misdemeanor cases, must be unanimous to convict or acquit; if jurors can't reach unanimous agreement, the result is a hung jury and a mistrial rather than a majority-rules outcome."}, {"id": 72, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "How are people currently selected to serve on grand juries in Texas?", "options": ["a) through a random selection process", "b) through a county election", "c) through the \"pick-a-pal\" system", "d) through the \"key man\" system"], "correct_answer": "a) through a random selection process", "explanation": "Texas has moved away from the old 'key man' system (in which jury commissioners handpicked potential grand jurors, often reproducing bias) toward selecting grand jurors through random selection, similar to how trial jury pools are drawn."}, {"id": 73, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "It is often quite difficult for people to readjust to life after the average Texas prison because", "options": ["a) there is not an economic incentive for employers to hire felons.", "b) family members may have moved, died, or cut off communications, thereby removing a support network.", "c) the state requires that you repay the cost of your incarceration, so you are in debt to the state the minute you leave the prison.", "d) once convicted of a felony in Texas, you never fully regain all of your rights, including your right to vote."], "correct_answer": "b) family members may have moved, died, or cut off communications, thereby removing a support network.", "explanation": "Reentry after prison is difficult for many reasons, but one major factor is that family members may have moved, died, or lost contact during a long sentence, leaving formerly incarcerated people without the support network they need to find housing, work, and stability."}, {"id": 74, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "As a result of criminal justice reforms in Texas, if prosecutors want to use testimony from jailhouse informants, they must also", "options": ["a) obtain a signed waiver from the informant before any testimony is offered", "b) share with the defense attorneys the criminal history of the jailhouse informant and anything offered to the informant in return for his or her testimony.", "c) have the informant testify under oath in a private hearing before the judge, without the jury present", "d) provide the defense with a psychological evaluation of the informant conducted by the state"], "correct_answer": "b) share with the defense attorneys the criminal history of the jailhouse informant and anything offered to the informant in return for his or her testimony.", "explanation": "Reforms enacted after wrongful-conviction scandals now require prosecutors who use jailhouse informant testimony to disclose that informant's criminal history and any deal or benefit offered in exchange for testifying, so the defense can challenge the informant's credibility."}, {"id": 75, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "Who can prosecute felony cases in Texas?", "options": ["a) county judges", "b) district attorneys or offices of the criminal district attorney", "c) county attorneys", "d) the Office of the Attorney General"], "correct_answer": "b) district attorneys or offices of the criminal district attorney", "explanation": "Felony cases in Texas are prosecuted by district attorneys or, in some jurisdictions, criminal district attorneys \u2014 county attorneys typically handle misdemeanors, and the state Attorney General's office does not independently prosecute local felony cases."}, {"id": 76, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "What is the difference between an assigned counsel and a public defender?", "options": ["a) A public defender is only used in cases that involve an adult defendant, while an assigned counsel is used if the defendant is a juvenile.", "b) An assigned counsel works cases that are being prosecuted by a county attorney while a public defender works cases that are being prosecuted by a district attorney.", "c) An assigned counsel is a private attorney who is appointed by a judge to represent people who cannot afford an attorney, and a public defender is paid a salary by the government to represent indigent defendants.", "d) An assigned counsel represents people who cannot afford an attorney who are charged with misdemeanors, while a public defender represents people who cannot afford an attorney who are charged with felonies."], "correct_answer": "c) An assigned counsel is a private attorney who is appointed by a judge to represent people who cannot afford an attorney, and a public defender is paid a salary by the government to represent indigent defendants.", "explanation": "An assigned counsel is a private attorney a judge appoints (and the county pays) to represent a specific indigent defendant, while a public defender is a salaried government employee whose full-time job is representing indigent defendants \u2014 the distinction is about employment structure, not case type or defendant age."}, {"id": 77, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "In a felony case, before a defendant goes to trial, who grants a verdict that there is sufficient evidence to begin prosecution and that a threshold of probable cause has been met?", "options": ["a) a petit jury", "b) the county attorney", "c) the district attorney", "d) the grand jury"], "correct_answer": "d) the grand jury", "explanation": "Before a felony case goes to trial, a grand jury reviews the evidence and decides whether there's probable cause to proceed, returning either a 'true bill' (indictment) or a 'no bill' \u2014 it does not rule on guilt or innocence, which is left to the trial (petit) jury or judge."}, {"id": 78, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "Today, the Texas Department of Criminal Justice operates the prison system. Who runs this agency?", "options": ["a) a nine-member board that is appointed by the governor", "b) a nine-member board that is appointed by members of the Texas Supreme Court and the Texas Court of Criminal Appeals", "c) a nine-member board that is appointed by the sheriffs of the largest counties (by population)", "d) a nine-member board appointed jointly by the governor and the lieutenant governor"], "correct_answer": "a) a nine-member board that is appointed by the governor", "explanation": "The Texas Department of Criminal Justice is overseen by a nine-member board appointed by the governor, which sets policy for the state's prisons, state jails, and substance-abuse treatment facilities."}, {"id": 79, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "The licensing of police officers in Texas is regulated by the Texas Commission on Law Enforcement. How are the nine members of this commission selected?", "options": ["a) They are appointed by the governor and confirmed by the Senate.", "b) They are elected in statewide, staggered elections.", "c) They are appointed by the mayors of the nine largest cities.", "d) They are appointed by the governor and confirmed by the House."], "correct_answer": "a) They are appointed by the governor and confirmed by the Senate.", "explanation": "The nine members of the Texas Commission on Law Enforcement, which licenses and regulates peace officers, are appointed by the governor and confirmed by the Texas Senate \u2014 the same appointment structure used for many state boards and commissions."}, {"id": 80, "chapter": 14, "topic": "Crime, Corrections, and Public Safety", "question": "If sentenced by a judge to probation, you would most likely have to do which of the following?", "options": ["a) wear an ankle monitor at all times and remain confined to your residence except for work", "b) have a steady job, report to your probation officer on a regular basis, abstain from drug and alcohol use, and pay any fines or restitution", "c) plead guilty to lesser violations of the law than you were originally charged with so that you can be released early", "d) report to the local jail during the weekends, report to your probation officer"], "correct_answer": "b) have a steady job, report to your probation officer on a regular basis, abstain from drug and alcohol use, and pay any fines or restitution", "explanation": "Standard probation conditions typically require the person to hold a steady job, report regularly to a probation officer, avoid drugs and alcohol, and pay any fines or restitution owed \u2014 violating these terms can result in the probation being revoked and a prison or jail sentence imposed instead."}]
</script>

<script>
const ALL_QUESTIONS = JSON.parse(document.getElementById('question-data').textContent);

const CHAPTER_INFO = {};
ALL_QUESTIONS.forEach(q => {
  if(!CHAPTER_INFO[q.chapter]) CHAPTER_INFO[q.chapter] = {topic:q.topic, count:0};
  CHAPTER_INFO[q.chapter].count++;
});
const chapters = Object.keys(CHAPTER_INFO).map(Number).sort((a,b)=>a-b);

let selectedChapters = new Set(chapters);
let selectedLength = 'all';
let orderMode = 'shuffled';
let session = [], idx = 0, score = 0, answers = [], answeredCurrent = false;

// build chapter checkboxes
const chapterChecks = document.getElementById('chapterChecks');
chapters.forEach(ch=>{
  const id = 'ch'+ch;
  const label = document.createElement('label');
  label.innerHTML = `<input type="checkbox" id="${id}" value="${ch}" checked> Ch. ${ch} - ${CHAPTER_INFO[ch].topic} (${CHAPTER_INFO[ch].count})`;
  chapterChecks.appendChild(label);
});
chapterChecks.addEventListener('change', ()=>{
  selectedChapters = new Set([...chapterChecks.querySelectorAll('input:checked')].map(c=>Number(c.value)));
  if(selectedChapters.size === 0) selectedChapters = new Set(chapters);
  updateLengthOptions();
});

const lengthSelect = document.getElementById('lengthSelect');
function updateLengthOptions(){
  const poolSize = ALL_QUESTIONS.filter(q=>selectedChapters.has(q.chapter)).length;
  lengthSelect.innerHTML = '';
  [10,20,40].forEach(n=>{
    if(n >= poolSize) return;
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    lengthSelect.appendChild(o);
  });
  const allOpt = document.createElement('option');
  allOpt.value = 'all'; allOpt.textContent = `All (${poolSize})`;
  lengthSelect.appendChild(allOpt);
  lengthSelect.value = 'all';
}
updateLengthOptions();

document.querySelectorAll('input[name=order]').forEach(r=>{
  r.addEventListener('change', e=> orderMode = e.target.value);
});

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildSession(){
  let pool = ALL_QUESTIONS.filter(q=>selectedChapters.has(q.chapter));
  pool = orderMode === 'shuffled' ? shuffle(pool) : [...pool].sort((a,b)=>a.id-b.id);
  const len = lengthSelect.value;
  if(len !== 'all') pool = pool.slice(0, Number(len));
  return pool;
}

document.getElementById('beginBtn').addEventListener('click', ()=>{
  selectedLength = lengthSelect.value;
  session = buildSession();
  startQuiz();
});

const landing = document.getElementById('landing');
const quizDiv = document.getElementById('quiz');
const resultsDiv = document.getElementById('results');

function startQuiz(){
  idx = 0; score = 0; answers = [];
  landing.classList.add('hidden');
  resultsDiv.classList.add('hidden');
  quizDiv.classList.remove('hidden');
  renderQuestion();
}

let currentOptionEls = []; // label elements in currently displayed order, for keybind access

function stripPrefix(s){
  const m = /^[a-dA-D]\)\s*(.*)$/.exec(s);
  return m ? m[1] : s;
}

function renderQuestion(){
  answeredCurrent = false;
  const q = session[idx];
  document.getElementById('progressLabel').textContent = `Question ${idx+1} of ${session.length} — Ch. ${q.chapter}: ${q.topic} — Score: ${score}/${idx}`;
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('feedback').textContent = '';
  const expEl = document.getElementById('explanation');
  expEl.textContent = '';
  expEl.classList.add('hidden');
  const optWrap = document.getElementById('optionsList');
  optWrap.innerHTML = '';

  // Randomize the order options are shown in each time this question is rendered.
  const displayOptions = shuffle(q.options.map(stripPrefix));
  currentOptionEls = [];
  displayOptions.forEach((text, i)=>{
    const label = document.createElement('label');
    const hint = document.createElement('span');
    hint.className = 'key-hint';
    hint.textContent = (i+1) + '.';
    label.appendChild(hint);
    label.appendChild(document.createTextNode(text));
    label.dataset.text = text;
    label.addEventListener('click', ()=>handleAnswer(text, label));
    optWrap.appendChild(label);
    currentOptionEls.push(label);
  });
  document.getElementById('nextBtn').classList.add('hidden');
}

document.addEventListener('keydown', (e)=>{
  if(quizDiv.classList.contains('hidden')) return; // only active during quiz screen
  const n = Number(e.key);
  if(n >= 1 && n <= 4){
    const label = currentOptionEls[n-1];
    if(label && !answeredCurrent){
      handleAnswer(label.dataset.text, label);
    }
    return;
  }
  if(e.key === 'Enter' && answeredCurrent){
    document.getElementById('nextBtn').click();
  }
});

function handleAnswer(chosen, labelEl){
  if(answeredCurrent) return;
  answeredCurrent = true;
  const q = session[idx];
  const correctText = stripPrefix(q.correct_answer);
  const isRight = chosen === correctText;
  if(isRight) score++;
  answers.push({question:q, chosen, isRight});

  currentOptionEls.forEach(l=>{
    if(l.dataset.text === correctText) l.classList.add('correct');
    else if(l === labelEl) l.classList.add('wrong');
  });
  document.getElementById('feedback').textContent = isRight ? 'Correct.' : `Incorrect. Correct answer: ${correctText}`;
  const expEl = document.getElementById('explanation');
  expEl.textContent = 'Why: ' + q.explanation;
  expEl.classList.remove('hidden');
  document.getElementById('progressLabel').textContent = `Question ${idx+1} of ${session.length} — Ch. ${q.chapter}: ${q.topic} — Score: ${score}/${idx+1}`;
  document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(idx < session.length - 1){ idx++; renderQuestion(); }
  else showResults();
});

function showResults(){
  quizDiv.classList.add('hidden');
  resultsDiv.classList.remove('hidden');
  document.getElementById('resultScore').textContent = `Score: ${score}/${session.length} (${Math.round(score/session.length*100)}%)`;

  const byChapter = {};
  answers.forEach(a=>{
    const key = `Ch. ${a.question.chapter} - ${a.question.topic}`;
    if(!byChapter[key]) byChapter[key] = {right:0, total:0};
    byChapter[key].total++;
    if(a.isRight) byChapter[key].right++;
  });
  const tbody = document.querySelector('#breakdownTable tbody');
  tbody.innerHTML = '';
  Object.entries(byChapter).forEach(([label, v])=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${label}</td><td>${v.right}/${v.total}</td>`;
    tbody.appendChild(tr);
  });

  const improveList = document.getElementById('improveList');
  improveList.innerHTML = '';
  const weak = Object.entries(byChapter)
    .map(([label, v]) => ({label, ...v, pct: v.right / v.total}))
    .filter(c => c.pct < 1)
    .sort((a, b) => a.pct - b.pct);
  if(weak.length === 0){
    improveList.textContent = 'No weak spots — you got every category 100% correct.';
  } else {
    const ul = document.createElement('ul');
    weak.forEach(c=>{
      const li = document.createElement('li');
      li.textContent = `${c.label} — ${c.right}/${c.total} (${Math.round(c.pct*100)}%)`;
      ul.appendChild(li);
    });
    improveList.appendChild(ul);
  }

  const missedList = document.getElementById('missedList');
  missedList.innerHTML = '';
  const missed = answers.filter(a=>!a.isRight);
  if(missed.length === 0){
    missedList.textContent = 'None — all correct.';
  } else {
    missed.forEach(a=>{
      const div = document.createElement('div');
      div.innerHTML = `<strong>${a.question.question}</strong><br>Your answer: ${a.chosen}<br>Correct answer: ${stripPrefix(a.question.correct_answer)}<br><em>Why: ${a.question.explanation}</em>`;
      missedList.appendChild(div);
    });
  }
}

document.getElementById('retryBtn').addEventListener('click', ()=>{
  session = orderMode === 'shuffled' ? shuffle(session) : session;
  startQuiz();
});
document.getElementById('newBtn').addEventListener('click', ()=>{
  resultsDiv.classList.add('hidden');
  landing.classList.remove('hidden');
  updateLengthOptions();
});
</script>
</body>
</html>
