<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texas Government Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Texas Government Quiz</h1>

<div id="landing">
  <fieldset>
    <legend>Chapters</legend>
    <div id="chapterChecks"></div>
  </fieldset>

  <fieldset>
    <legend>Number of questions</legend>
    <select id="lengthSelect"></select>
  </fieldset>

  <fieldset>
    <legend>Order</legend>
    <label>
      <input type="radio" name="order" value="shuffled" checked>
      Shuffled
    </label>

    <label>
      <input type="radio" name="order" value="sequential">
      Sequential
    </label>
  </fieldset>

  <button id="beginBtn">Start Quiz</button>
</div>

<div id="quiz" class="hidden">
  <p id="progressLabel"></p>

  <p>
    <strong id="questionText"></strong>
  </p>

  <div id="optionsList"></div>

  <p id="feedback"></p>

  <div id="explanation" class="hidden"></div>

  <button id="nextBtn" class="hidden">Next</button>
</div>

<div id="results" class="hidden">

  <h2 id="resultScore"></h2>

  <table id="breakdownTable">
    <thead>
      <tr>
        <th>Chapter</th>
        <th>Score</th>
      </tr>
    </thead>

    <tbody></tbody>
  </table>

  <h3>Areas to Improve</h3>
  <div id="improveList"></div>

  <h3>Missed Questions</h3>
  <div id="missedList"></div>

  <button id="retryBtn">Retry Same Setup</button>
  <button id="newBtn">New Quiz</button>

</div>

<script src="questions.js"></script>
<script src="quiz.js"></script>

</body>
</html>
